# Default Subnet for Pod networking
# This creates a default subnet using the cluster CIDR from values.yaml
# Uses post-install hook to ensure CRD is registered before creating CR
{{- if .Values.network.createDefaultSubnet | default true }}
---
apiVersion: network.zstack.io/v1
kind: Subnet
metadata:
  name: {{ .Values.network.defaultSubnetName | default "default" }}
  labels:
    {{- include "zstack-ovn-kubernetes.labels" . | nindent 4 }}
    network-type: overlay
  annotations:
    # Hook to run after all other resources are installed
    "helm.sh/hook": post-install,post-upgrade
    # Weight determines order among hooks (lower runs first)
    "helm.sh/hook-weight": "10"
    # Keep the resource after hook completes
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  # Pod network CIDR from values.yaml
  cidr: {{ .Values.network.clusterCIDR | quote }}
  
  # Gateway is the first usable IP in the CIDR
  gateway: {{ include "zstack-ovn-kubernetes.defaultGateway" . | quote }}
  
  # Exclude gateway IP from allocation
  excludeIPs:
    - {{ include "zstack-ovn-kubernetes.defaultGateway" . | quote }}
  
  # IP protocol version
  protocol: IPv4
  
  # Mark as default subnet for Pods without explicit subnet annotation
  default: true
{{- end }}
